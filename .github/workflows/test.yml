name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  windows-loader:
    runs-on: windows-2022
    steps:
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare Rust loader versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem $installPath -Recurse -Filter dumpbin.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin.exe$' } |
            Select-Object -First 1

          $dll = Join-Path $env:SystemRoot 'System32\bcryptprimitives.dll'
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "DLL=$dll"
          Write-Host "DLL_VERSION=$((Get-Item $dll).VersionInfo.FileVersion)"
          Write-Host 'DLL_PROCESSPRNG_EXPORT:'
          & $dumpbin.FullName /EXPORTS $dll |
            Select-String -Pattern 'ProcessPrng' |
            ForEach-Object { Write-Host $_.Line }

          'fn main() { println!("minimal-ok"); }' | Set-Content minimal.rs -Encoding ascii

          Write-Host '=== STABLE ==='
          rustc -vV
          rustc minimal.rs -o minimal-stable.exe
          & .\minimal-stable.exe
          $stableCode = $LASTEXITCODE
          Write-Host "STABLE_EXIT=$stableCode"
          Write-Host 'STABLE_RNG_IMPORT:'
          & $dumpbin.FullName /IMPORTS minimal-stable.exe |
            Select-String -Pattern 'bcryptprimitives|ProcessPrng|SystemFunction036' |
            ForEach-Object { Write-Host $_.Line }

          Write-Host '=== RUST 1.78.0 ==='
          rustup toolchain install 1.78.0 --profile minimal
          rustc +1.78.0 -vV
          rustc +1.78.0 minimal.rs -o minimal-178.exe
          & .\minimal-178.exe
          $oldCode = $LASTEXITCODE
          Write-Host "RUST_1_78_EXIT=$oldCode"
          Write-Host 'RUST_1_78_RNG_IMPORT:'
          & $dumpbin.FullName /IMPORTS minimal-178.exe |
            Select-String -Pattern 'bcryptprimitives|ProcessPrng|SystemFunction036|BCryptGenRandom' |
            ForEach-Object { Write-Host $_.Line }

          if ($oldCode -ne 0) { exit $oldCode }

  i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check locale key parity (en.json ↔ zh-CN.json)
        run: pnpm i18n:check
