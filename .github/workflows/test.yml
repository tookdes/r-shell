name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Capture Rust clippy output
        id: clippy
        continue-on-error: true
        working-directory: src-tauri
        shell: bash
        run: cargo clippy --quiet --message-format short -- -D warnings 2>&1 | tee clippy-output.txt

      - name: Upload clippy output
        if: matrix.platform == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-output
          path: src-tauri/clippy-output.txt

      - name: Fail on clippy warnings
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  windows-project-comparison:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: main
          - label: review
            ref: review/codex-workspace-sync

    name: windows-project (${{ matrix.label }})
    runs-on: windows-2022

    steps:
      - name: Checkout ${{ matrix.label }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows-project-${{ matrix.label }}

      - name: Build and run Rust test executable
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = Join-Path $PWD "windows-$env:LABEL.txt"
          cargo test --no-run *>&1 | Tee-Object -FilePath $output
          $buildCode = $LASTEXITCODE
          $exe = Get-ChildItem 'target\debug\deps\r_shell_lib-*.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($exe) {
            & $exe.FullName --list *>&1 | Tee-Object -FilePath $output -Append
            $runCode = $LASTEXITCODE
          } else {
            $runCode = -1
          }
          "build_exit_code=$buildCode`nrun_exit_code=$runCode" | Tee-Object -FilePath $output -Append
        env:
          LABEL: ${{ matrix.label }}

      - name: Upload Windows comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-project-${{ matrix.label }}
          path: src-tauri/windows-${{ matrix.label }}.txt

  i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check locale key parity (en.json ↔ zh-CN.json)
        run: pnpm i18n:check
