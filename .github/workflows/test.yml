name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    continue-on-error: ${{ matrix.platform == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run Rust clippy
        if: matrix.platform != 'macos-latest'
        working-directory: src-tauri
        run: cargo clippy -- -D warnings -A dead_code

      - name: Capture macOS Rust clippy output
        if: matrix.platform == 'macos-latest'
        id: macos_clippy
        continue-on-error: true
        working-directory: src-tauri
        shell: bash
        run: cargo clippy --quiet --message-format short -- -D warnings -A dead_code 2>&1 | tee macos-clippy-output.txt

      - name: Upload macOS Rust clippy output
        if: matrix.platform == 'macos-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-clippy-output
          path: src-tauri/macos-clippy-output.txt

      - name: Fail on macOS Rust clippy warnings
        if: matrix.platform == 'macos-latest' && steps.macos_clippy.outcome == 'failure'
        run: exit 1

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  i18n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check locale key parity (en.json ↔ zh-CN.json)
        run: pnpm i18n:check
