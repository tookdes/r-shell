name: Controlled PR validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  repair-pty-locks:
    if: >-
      github.event.action == 'reopened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact PTY lock fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/connection_manager.rs')
          text = path.read_text()

          old_write = '''    pub async fn write_to_pty(&self, connection_id: &str, data: Vec<u8>) -> Result<()> {
              let pty_sessions = self.pty_sessions.read().await;
              let pty = pty_sessions
                  .get(connection_id)
                  .ok_or_else(|| anyhow::anyhow!("PTY connection not found"))?;

              match pty.input_tx.try_send(data) {
                  Ok(_) => Ok(()),
                  Err(tokio::sync::mpsc::error::TrySendError::Full(data)) => pty
                      .input_tx
                      .send(data)
                      .await
                      .map_err(|_| anyhow::anyhow!("PTY channel closed")),
                  Err(tokio::sync::mpsc::error::TrySendError::Closed(_)) => {
                      Err(anyhow::anyhow!("PTY channel closed"))
                  }
              }
          }
          '''.replace('              ', '        ').replace('          }', '    }')
          new_write = '''    pub async fn write_to_pty(&self, connection_id: &str, data: Vec<u8>) -> Result<()> {
              let input_tx = {
                  let pty_sessions = self.pty_sessions.read().await;
                  let pty = pty_sessions
                      .get(connection_id)
                      .ok_or_else(|| anyhow::anyhow!("PTY connection not found"))?;
                  pty.input_tx.clone()
              };

              match input_tx.try_send(data) {
                  Ok(_) => Ok(()),
                  Err(tokio::sync::mpsc::error::TrySendError::Full(data)) => input_tx
                      .send(data)
                      .await
                      .map_err(|_| anyhow::anyhow!("PTY channel closed")),
                  Err(tokio::sync::mpsc::error::TrySendError::Closed(_)) => {
                      Err(anyhow::anyhow!("PTY channel closed"))
                  }
              }
          }
          '''.replace('              ', '        ').replace('          }', '    }')

          old_resize = '''    pub async fn resize_pty(&self, connection_id: &str, cols: u32, rows: u32) -> Result<()> {
              let pty_sessions = self.pty_sessions.read().await;
              let pty = pty_sessions
                  .get(connection_id)
                  .ok_or_else(|| anyhow::anyhow!("PTY connection not found"))?;

              pty.resize_tx
                  .send((cols, rows))
                  .await
                  .map_err(|_| anyhow::anyhow!("PTY resize channel closed"))
          }
          '''.replace('              ', '        ').replace('          }', '    }')
          new_resize = '''    pub async fn resize_pty(&self, connection_id: &str, cols: u32, rows: u32) -> Result<()> {
              let resize_tx = {
                  let pty_sessions = self.pty_sessions.read().await;
                  let pty = pty_sessions
                      .get(connection_id)
                      .ok_or_else(|| anyhow::anyhow!("PTY connection not found"))?;
                  pty.resize_tx.clone()
              };

              resize_tx
                  .send((cols, rows))
                  .await
                  .map_err(|_| anyhow::anyhow!("PTY resize channel closed"))
          }
          '''.replace('              ', '        ').replace('          }', '    }')

          marker = '''        drop(output_tx);
          assert!(mgr.read_from_pty("event-read", None).await.is_err());
      }

      #[tokio::test]
      async fn test_get_connection_type_returns_none_for_unknown() {
      '''.replace('          ', '        ').replace('      }', '    }').replace('      #[', '    #[').replace('      async', '    async')
          replacement = '''        drop(output_tx);
          assert!(mgr.read_from_pty("event-read", None).await.is_err());
      }

      #[tokio::test]
      async fn test_blocked_pty_sends_do_not_hold_session_map_lock() {
          let mgr = Arc::new(ConnectionManager::new());
          let (input_tx, mut input_rx) = tokio::sync::mpsc::channel::<Vec<u8>>(1);
          let (_output_tx, output_rx) = tokio::sync::mpsc::channel::<Vec<u8>>(1);
          let (resize_tx, mut resize_rx) = tokio::sync::mpsc::channel::<(u32, u32)>(1);

          input_tx.send(b"occupied".to_vec()).await.unwrap();
          resize_tx.send((1, 1)).await.unwrap();

          let session = PtySession {
              input_tx,
              output_rx: Arc::new(tokio::sync::Mutex::new(output_rx)),
              resize_tx,
              cancel: CancellationToken::new(),
          };
          mgr.pty_sessions
              .write()
              .await
              .insert("blocked-sends".to_string(), Arc::new(session));

          let write_mgr = mgr.clone();
          let write_task = tokio::spawn(async move {
              write_mgr
                  .write_to_pty("blocked-sends", b"next".to_vec())
                  .await
          });
          let resize_mgr = mgr.clone();
          let resize_task = tokio::spawn(async move {
              resize_mgr.resize_pty("blocked-sends", 80, 24).await
          });

          tokio::time::sleep(std::time::Duration::from_millis(25)).await;
          let close = tokio::time::timeout(
              std::time::Duration::from_millis(500),
              mgr.close_pty_connection("blocked-sends", None),
          )
          .await;
          assert!(
              close.is_ok(),
              "blocked PTY input/resize sends must not hold the pty_sessions map lock"
          );

          assert_eq!(input_rx.recv().await.unwrap(), b"occupied".to_vec());
          assert_eq!(resize_rx.recv().await.unwrap(), (1, 1));
          assert!(write_task.await.unwrap().is_ok());
          assert!(resize_task.await.unwrap().is_ok());
          assert_eq!(input_rx.recv().await.unwrap(), b"next".to_vec());
          assert_eq!(resize_rx.recv().await.unwrap(), (80, 24));
      }

      #[tokio::test]
      async fn test_get_connection_type_returns_none_for_unknown() {
      '''.replace('          ', '        ').replace('      }', '    }').replace('      #[', '    #[').replace('      async', '    async')

          for old, new, label in [
              (old_write, new_write, 'write_to_pty'),
              (old_resize, new_resize, 'resize_pty'),
              (marker, replacement, 'regression test marker'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected {label} context: {count} matches')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check || cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          git diff -- src-tauri/src/connection_manager.rs
      - name: Commit PTY lock repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/connection_manager.rs
          git commit -m 'fix: release PTY session map locks before sends'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - name: Run Rust tests
        if: matrix.platform != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Compile Rust tests on Windows
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ matrix.platform }}
          path: clippy.log
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  windows-package:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-package
          path: clippy.log
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: r-shell-windows-package
          if-no-files-found: error
          path: |
            src-tauri/target/release/r-shell.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
