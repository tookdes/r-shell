name: Controlled PR validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: controller
      - uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
          path: work
      - name: Apply final secret persistence repair
        shell: bash
        run: |
          cd work
          python ../controller/.github/scripts/apply-final-secret-repair.py
          git diff --check
          if git diff --quiet; then
            echo "Secret persistence repair already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/connection-dialog.tsx src/__tests__/connection-dialog-proxy.test.tsx
          git commit -m "fix: encrypt secrets before failed connection persistence"
          git push origin HEAD:fix/terminal-rendering-upstream-sync

  validate:
    needs: prepare
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - name: Run Rust tests
        if: matrix.platform != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Compile Rust tests on Windows
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  windows-package:
    needs: prepare
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: r-shell-windows-package
          if-no-files-found: error
          path: |
            src-tauri/target/release/r-shell.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
