name: Controlled PR validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - name: Run Rust tests
        if: matrix.platform != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Compile Rust tests on Windows
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ matrix.platform }}
          path: clippy.log
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  windows-package:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm i18n:check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run
      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-package
          path: clippy.log
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Build Windows package without updater signing
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: r-shell-windows-package
          if-no-files-found: error
          path: |
            src-tauri/target/release/r-shell.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
