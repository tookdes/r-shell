name: Fix restore cancel arg

on:
  push:
    branches:
      - sync/upstream-2.9.2-selected
    paths:
      - .github/workflows/fix-restore-cancel-arg.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2.9.2-selected
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fix Tauri command argument name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          old = "void invoke('ssh_cancel_connect', { connectionId: pendingSshId })"
          new = "void invoke('ssh_cancel_connect', { connection_id: pendingSshId })"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one restore cancel call, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Frontend tests
        run: pnpm test
      - name: Verify runtime argument shape
        run: |
          grep -F "invoke('ssh_cancel_connect', { connection_id: pendingSshId })" src/App.tsx
          ! grep -F "invoke('ssh_cancel_connect', { connectionId: pendingSshId })" src/App.tsx
      - name: Commit product fix and clean workflow
        run: |
          rm -f .github/workflows/fix-restore-cancel-arg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cancel timed-out restored SSH connection"
          git fetch origin sync/upstream-2.9.2-selected
          git rebase origin/sync/upstream-2.9.2-selected
          git push origin HEAD:sync/upstream-2.9.2-selected
