name: Controlled terminal fix review sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
          fetch-depth: 0

      - name: Verify controlled branch
        run: |
          test "${{ github.event.pull_request.head.ref }}" = "fix/terminal-rendering-upstream-sync"

      - name: Run repository validation
        run: |
          echo "Validation is intentionally run from repository code only."
          echo "Follow-up CI jobs remain authoritative."
