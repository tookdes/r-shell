name: Controlled terminal fix review sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
          fetch-depth: 0

      - name: Verify controlled branch
        run: |
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "${{ github.event.pull_request.head.ref }}" = "fix/terminal-rendering-upstream-sync"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply reviewed core fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, marker):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count == 1:
                  p.write_text(s.replace(old, new, 1))
                  return
              if count == 0 and marker in s:
                  return
              raise SystemExit(f'{path}: expected exactly one old block, found {count}; marker={marker!r}')

          # connection-dialog.tsx: edited connections must never write raw secrets.
          patch(
              'src/components/connection-dialog.tsx',
