name: Controlled terminal fix review sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: main
          path: controller

      - name: Checkout controlled work branch
        uses: actions/checkout@v7
        with:
          ref: fix/terminal-rendering-upstream-sync
          path: work
          fetch-depth: 0

      - name: Apply reviewed core fixes
        run: |
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "${{ github.event.pull_request.head.ref }}" = "fix/terminal-rendering-upstream-sync"
          python3 controller/.github/scripts/apply-terminal-core-fixes.py work
          python3 controller/.github/scripts/apply-terminal-post-fixes.py work
          cd work
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/components/pty-terminal.tsx src/components/connection-dialog.tsx src-tauri/src/lib.rs src-tauri/src/ssh/mod.rs
            git commit -m 'fix: isolate terminal renderer and harden PTY launch'
            git push origin HEAD:fix/terminal-rendering-upstream-sync
          fi
