name: Apply upstream selected phase 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2.9.2-selected
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply precise patches
        run: python3 scripts/apply-upstream-2.9.2-phase2.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Frontend tests
        run: pnpm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml os_keypath --lib
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: absorb upstream auth and tab improvements"
          git fetch origin sync/upstream-2.9.2-selected
          git rebase origin/sync/upstream-2.9.2-selected
          git push origin HEAD:sync/upstream-2.9.2-selected
