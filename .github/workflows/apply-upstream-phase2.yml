name: Apply upstream selected phase 2

on:
  push:
    branches:
      - sync/upstream-2.9.2-selected
    paths:
      - .github/workflows/apply-upstream-phase2.yml
      - scripts/apply-upstream-2.9.2-phase2.py
      - scripts/apply-upstream-2.9.2-phase2-tests.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2.9.2-selected
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Apply precise patches
        run: |
          python3 scripts/apply-upstream-2.9.2-phase2.py
          python3 scripts/apply-upstream-2.9.2-phase2-tests.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Frontend tests
        run: pnpm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml os_keypath --lib > /tmp/rust-phase2.log 2>&1
          status=$?
          set -e
          cat /tmp/rust-phase2.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/rust-phase2.log rust-phase2-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust-phase2-error.txt
            git commit -m "chore: capture phase 2 rust failure"
            git push origin HEAD:sync/upstream-2.9.2-selected
            exit "$status"
          fi
      - name: Commit validated product changes
        run: |
          rm -f rust-phase2-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: absorb upstream auth and tab improvements"
          git fetch origin sync/upstream-2.9.2-selected
          git rebase origin/sync/upstream-2.9.2-selected
          git push origin HEAD:sync/upstream-2.9.2-selected
