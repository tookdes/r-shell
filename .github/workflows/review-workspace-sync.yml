name: Review workspace sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-workspace-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Apply verified fixes
        run: |
          python3 scripts/review-workspace-sync-fix.py
          python3 scripts/review-workspace-sync-fix-2.py
          python3 scripts/review-workspace-sync-fix-3.py
          python3 scripts/review-workspace-sync-fix-4.py
          python3 scripts/review-workspace-sync-fix-5.py
          python3 scripts/review-workspace-sync-fix-6.py
          python3 scripts/review-workspace-sync-fix-7.py
          python3 scripts/review-workspace-sync-fix-8.py
          python3 scripts/review-workspace-sync-fix-9.py
          python3 scripts/review-workspace-sync-fix-10.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        id: frontend
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm build
            pnpm test
            pnpm i18n:check
          } 2>&1 | tee review-frontend.log

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt

      - name: Rust checks
        id: rust
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set -o pipefail
          {
            cargo fmt --check
            cargo test
            cargo clippy -- -D warnings -A dead_code
          } 2>&1 | tee ../review-rust.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-sync-review-logs
          path: |
            review-frontend.log
            review-rust.log
          if-no-files-found: warn

      - name: Commit applied fixes
        if: steps.frontend.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finish workspace-sync security review [review-ci]'
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          fi

      - name: Fail when verification failed
        if: steps.frontend.outcome != 'success' || steps.rust.outcome != 'success'
        run: exit 1
