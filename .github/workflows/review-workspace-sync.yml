name: Final clean verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-clean-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm build
          pnpm test
          pnpm i18n:check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo clippy -- -D warnings -A dead_code

      - name: Remove temporary review infrastructure
        run: |
          rm -f .review-ci-status .review-fixes.log .review-frontend.log .review-rust.log
          rm -f scripts/review-workspace-sync-fix.py
          rm -f scripts/review-workspace-sync-fix-{2,3,4,5,6,7,8,9,10}.py
          rm -f .github/workflows/review-workspace-sync.yml

      - name: Commit clean reviewed tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary review infrastructure'
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          fi
