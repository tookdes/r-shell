name: Review workspace sync

on:
  push:
    branches:
      - review/codex-workspace-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: node
        if: always()
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'

      - name: Setup pnpm
        id: pnpm
        if: always()
        uses: pnpm/action-setup@v4
        continue-on-error: true
        with:
          version: 9.15.4

      - name: Setup Rust
        id: rust_setup
        if: always()
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        id: system_deps
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        id: frontend_deps
        if: always()
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        id: frontend
        if: always()
        continue-on-error: true
        run: |
          pnpm build
          pnpm test
          pnpm i18n:check

      - name: Rust checks
        id: rust
        if: always()
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo clippy -- -D warnings

      - name: Record verification result
        if: always()
        run: |
          printf 'checkout=%s\nnode=%s\npnpm=%s\nrust_setup=%s\nsystem_deps=%s\nfrontend_deps=%s\nfrontend=%s\nrust=%s\n' \
            '${{ steps.checkout.outcome }}' \
            '${{ steps.node.outcome }}' \
            '${{ steps.pnpm.outcome }}' \
            '${{ steps.rust_setup.outcome }}' \
            '${{ steps.system_deps.outcome }}' \
            '${{ steps.frontend_deps.outcome }}' \
            '${{ steps.frontend.outcome }}' \
            '${{ steps.rust.outcome }}' > .review-ci-status
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .review-ci-status
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record review CI status [review-ci]'
            git push
          fi

      - name: Fail when verification failed
        if: always() && (steps.frontend.outcome != 'success' || steps.rust.outcome != 'success')
        run: exit 1
