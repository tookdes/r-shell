name: Review workspace sync

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-workspace-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Apply verified fixes
        run: |
          python3 scripts/review-workspace-sync-fix.py
          python3 scripts/review-workspace-sync-fix-2.py
          python3 scripts/review-workspace-sync-fix-3.py
          python3 scripts/review-workspace-sync-fix-4.py
          python3 scripts/review-workspace-sync-fix-5.py
          python3 scripts/review-workspace-sync-fix-6.py
          python3 scripts/review-workspace-sync-fix-7.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt

      - name: Frontend checks
        run: |
          pnpm build
          pnpm test
          pnpm i18n:check

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo clippy -- -D warnings

      - name: Commit applied fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finish workspace-sync security review [review-ci]'
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          fi
