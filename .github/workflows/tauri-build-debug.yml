name: Tauri build diagnostics

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/terminal-rendering-upstream-sync'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture Tauri build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm tauri build *>&1 | Tee-Object -FilePath tauri-build.log
          $code = $LASTEXITCODE
          exit $code
      - name: Upload Tauri build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: error
