name: Windows artifact validation

on:
  pull_request:
    branches: [main]

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: TypeScript
        run: pnpm tsc --noEmit

      - name: i18n
        run: pnpm i18n:check

      - name: Rust compile validation
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --no-run

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Windows package
        run: pnpm tauri build

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: r-shell-windows-package
          if-no-files-found: error
          path: |
            src-tauri/target/release/r-shell.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
