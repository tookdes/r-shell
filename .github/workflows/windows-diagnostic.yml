name: Windows Rust diagnostic

on:
  push:
    branches:
      - review/codex-workspace-sync

permissions:
  contents: write

concurrency:
  group: windows-rust-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[windows-diagnostic]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Inspect Windows loader failure
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'windows-rust-test-output.txt'
          "runner=windows-2022" | Out-File -FilePath $output -Encoding utf8
          Set-Location src-tauri

          cargo test --no-run *>&1 | Tee-Object -FilePath $output -Append
          $buildCode = $LASTEXITCODE
          $exe = Get-ChildItem 'target\debug\deps\r_shell_lib-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            Set-Location ..
            "build_exit_code=$buildCode`nrun_exit_code=-1" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
            exit 0
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem $installPath -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin.exe$' } |
            Select-Object -First 1

          "`nTEST_EXE=$($exe.FullName)" | Out-File -FilePath $output -Append
          "DUMPBIN=$($dumpbin.FullName)" | Out-File -FilePath $output -Append

          if ($dumpbin) {
            "`n==== EXE DEPENDENTS ====" | Out-File -FilePath $output -Append
            & $dumpbin.FullName /DEPENDENTS $exe.FullName *>&1 | Out-File -FilePath $output -Append
            "`n==== EXE IMPORTS ====" | Out-File -FilePath $output -Append
            & $dumpbin.FullName /IMPORTS $exe.FullName *>&1 | Out-File -FilePath $output -Append

            Get-ChildItem 'target\debug\deps\*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(r_shell_lib|WebView2Loader).*\.dll$' } |
              ForEach-Object {
                "`n==== DLL EXPORTS: $($_.FullName) ====" | Out-File -FilePath $output -Append
                & $dumpbin.FullName /EXPORTS $_.FullName *>&1 | Out-File -FilePath $output -Append
              }
          }

          "`n==== RUN TEST EXE ====" | Out-File -FilePath $output -Append
          $started = Get-Date
          & $exe.FullName --list *>&1 | Out-File -FilePath $output -Append
          $runCode = $LASTEXITCODE
          Start-Sleep -Seconds 2

          "`n==== RECENT APPLICATION EVENTS ====" | Out-File -FilePath $output -Append
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started} -ErrorAction SilentlyContinue |
            Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Format-List |
            Out-String -Width 500 |
            Out-File -FilePath $output -Append

          Set-Location ..
          "build_exit_code=$buildCode`nrun_exit_code=$runCode" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
          exit 0

      - name: Commit diagnostic output
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock windows-rust-test-output.txt windows-rust-test-status.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: capture Windows loader imports [windows-diagnostic]"
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          }
