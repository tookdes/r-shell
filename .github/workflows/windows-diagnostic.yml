name: Windows Rust diagnostic

on:
  push:
    branches:
      - review/codex-workspace-sync
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: windows-rust-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[windows-diagnostic]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Windows 2022 Rust tests
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location src-tauri
          cargo test *>&1 | Tee-Object -FilePath ../windows-rust-test-output.txt
          $code = $LASTEXITCODE
          Set-Location ..
          "runner=windows-2022`nexit_code=$code" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
          exit 0

      - name: Commit diagnostic output
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add windows-rust-test-output.txt windows-rust-test-status.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: test Windows 2022 runner [windows-diagnostic]"
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          }
