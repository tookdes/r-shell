name: Windows Rust diagnostic

on:
  push:
    branches:
      - review/codex-workspace-sync

permissions:
  contents: write

concurrency:
  group: windows-rust-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[windows-diagnostic]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Test before and after package clean
        timeout-minutes: 12
        continue-on-error: true
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'windows-rust-test-output.txt'
          "diagnostic started" | Out-File -FilePath $output -Encoding utf8
          Set-Location src-tauri

          "`nBEFORE_CLEAN" | Out-File -FilePath $output -Append
          cargo test --no-run *>&1 | Tee-Object -FilePath $output -Append
          $beforeExe = Get-ChildItem 'target\debug\deps\r_shell_lib-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($beforeExe) {
            & $beforeExe.FullName --list *>&1 | Tee-Object -FilePath $output -Append
            $beforeCode = $LASTEXITCODE
          } else {
            $beforeCode = -1
          }

          "`nCLEAN_PACKAGE" | Out-File -FilePath $output -Append
          cargo clean -p r-shell *>&1 | Tee-Object -FilePath $output -Append

          "`nAFTER_CLEAN" | Out-File -FilePath $output -Append
          cargo test -- --nocapture --test-threads=1 *>&1 | Tee-Object -FilePath $output -Append
          $afterCode = $LASTEXITCODE

          Set-Location ..
          "before_exit_code=$beforeCode`nafter_exit_code=$afterCode" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
          exit 0

      - name: Commit diagnostic output
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add windows-rust-test-output.txt windows-rust-test-status.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: verify Windows clean rebuild [windows-diagnostic]"
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          }
