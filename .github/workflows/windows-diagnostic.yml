name: Windows Rust diagnostic

on:
  push:
    branches:
      - review/codex-workspace-sync
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: windows-rust-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[windows-diagnostic]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/codex-workspace-sync
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Inspect Windows test executable
        timeout-minutes: 8
        continue-on-error: true
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'windows-rust-test-output.txt'
          "diagnostic started" | Out-File -FilePath $output -Encoding utf8

          Set-Location src-tauri
          cargo test --no-run *>&1 | Tee-Object -FilePath $output -Append
          $buildCode = $LASTEXITCODE

          $exe = Get-ChildItem 'target\debug\deps\r_shell_lib-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            "test executable not found" | Out-File -FilePath $output -Append
            Set-Location ..
            "build_exit_code=$buildCode" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
            exit 0
          }

          "`nTEST_EXE=$($exe.FullName)" | Out-File -FilePath $output -Append
          "`nDLLS_IN_DEPS:" | Out-File -FilePath $output -Append
          Get-ChildItem 'target\debug\deps\*.dll' -ErrorAction SilentlyContinue |
            Select-Object Name, FullName, Length |
            Format-Table -AutoSize |
            Out-String |
            Out-File -FilePath $output -Append

          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin.exe$' } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($dumpbin) {
            "`nDUMPBIN=$($dumpbin.FullName)" | Out-File -FilePath $output -Append
            "`nDEPENDENTS:" | Out-File -FilePath $output -Append
            & $dumpbin.FullName /DEPENDENTS $exe.FullName *>&1 | Out-File -FilePath $output -Append
            "`nIMPORTS:" | Out-File -FilePath $output -Append
            & $dumpbin.FullName /IMPORTS $exe.FullName *>&1 | Out-File -FilePath $output -Append
          } else {
            "dumpbin not found" | Out-File -FilePath $output -Append
          }

          "`nPATH_DLL_CANDIDATES:" | Out-File -FilePath $output -Append
          foreach ($name in @('WebView2Loader.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll')) {
            "--- $name ---" | Out-File -FilePath $output -Append
            where.exe $name *>&1 | Out-File -FilePath $output -Append
          }

          "`nRUN_TEST_EXE_LIST:" | Out-File -FilePath $output -Append
          & $exe.FullName --list *>&1 | Out-File -FilePath $output -Append
          $runCode = $LASTEXITCODE
          Set-Location ..
          "build_exit_code=$buildCode`nrun_exit_code=$runCode" | Out-File -FilePath windows-rust-test-status.txt -Encoding utf8
          exit 0

      - name: Commit diagnostic output
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add windows-rust-test-output.txt windows-rust-test-status.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: inspect Windows Rust loader failure [windows-diagnostic]"
            git pull --rebase origin review/codex-workspace-sync
            git push origin HEAD:review/codex-workspace-sync
          }
