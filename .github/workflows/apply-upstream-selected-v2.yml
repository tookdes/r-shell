name: Apply selected upstream sync v2

on:
  push:
    branches:
      - sync/upstream-2.9.2-selected

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2.9.2-selected
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply precise patches
        run: |
          python3 scripts/apply-upstream-2.9.2-selected.py
          rm -f .github/workflows/apply-upstream-selected-v2.yml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Frontend tests
        run: pnpm test
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: absorb upstream 2.9.2 reliability improvements"
          git push origin HEAD:sync/upstream-2.9.2-selected
